# ─────────────────────────────────────────────────────────────────────────────
# overlays/local-db/postgres.yaml  —  PostgreSQL StatefulSet + Service + PVC
#
# Only included when deploying with the local-db overlay.
# For an external database cluster, skip this file entirely and set
# DATABASE_URL in k8s/secrets.local.yaml to your external DSN.
#
# Tier 4 of the QueuePool fix: a custom postgresql.conf (from
# postgres-config.yaml) is mounted and selected via
# `args: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]`.
# ─────────────────────────────────────────────────────────────────────────────

# ── Persistent storage ────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: elite-powerplay
  labels:
    app.kubernetes.io/name: elite-powerplay
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard   # uncomment and set for your cluster's class

---

# ── StatefulSet ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: elite-powerplay
  labels:
    app.kubernetes.io/name: elite-powerplay
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: elite-powerplay
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999

      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: elite-powerplay-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: elite-powerplay-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elite-powerplay-postgres-secrets
                  key: postgres-password

          # Load the custom postgresql.conf (see postgres-config.yaml)
          args:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
              readOnly: true

          resources:
            requests:
              cpu:    "100m"
              memory: "256Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          readinessProbe:
            exec:
              command:
                - psql
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
                - -c
                - "SELECT 1"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-config
          configMap:
            name: postgres-config
            items:
              - key: postgresql.conf
                path: postgresql.conf

---

# ── Headless Service (stable DNS for StatefulSet) ─────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: elite-powerplay
  labels:
    app.kubernetes.io/name: elite-powerplay
    app.kubernetes.io/component: database
spec:
  selector:
    app: postgres
  clusterIP: None          # headless — resolves as postgres.elite-powerplay.svc
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
