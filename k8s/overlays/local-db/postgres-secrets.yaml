# ─────────────────────────────────────────────────────────────────────────────
# overlays/local-db/postgres-secrets.yaml  —  TEMPLATE  (never commit real values)
#
# HOW TO USE
# ----------
# 1. Copy this file:
#      cp k8s/overlays/local-db/postgres-secrets.yaml \
#         k8s/overlays/local-db/postgres-secrets.local.yaml
#
# 2. Replace the placeholder with the base64-encoded postgres password:
#      echo -n 'yourpassword' | base64
#
# 3. Apply to the cluster:
#      kubectl apply -f k8s/overlays/local-db/postgres-secrets.local.yaml
#
# 4. NEVER commit the .local.yaml file — it is covered by the
#    k8s/**/*.local.yaml rule in .gitignore.
#
# KEY DESCRIPTIONS
# ----------------
#   postgres-password   Password for the pp_user PostgreSQL account inside
#                       the in-cluster StatefulSet.  This Secret is consumed
#                       by the postgres container via POSTGRES_PASSWORD.
#                       The matching DATABASE_URL in k8s/secrets.local.yaml
#                       must use the same password.
#                       Generate: openssl rand -hex 16
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: elite-powerplay-postgres-secrets
  namespace: elite-powerplay
  labels:
    app.kubernetes.io/name: elite-powerplay
    app.kubernetes.io/component: database
type: Opaque
data:
  # echo -n 'yourpassword' | base64
  postgres-password: <base64-encoded-postgres-password>
