# ─────────────────────────────────────────────────────────────────────────────
# overlays/local-db/postgres-config.yaml  —  ConfigMap with custom postgresql.conf
#
# Mounted into the postgres container at /etc/postgresql/postgresql.conf
# and selected with `args: ["-c", "config_file=…"]` in postgres.yaml.
#
# Tuned for the 512 Mi memory limit on the postgres container.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: elite-powerplay
  labels:
    app.kubernetes.io/name: elite-powerplay
    app.kubernetes.io/component: database
data:
  postgresql.conf: |
    # ── Connection settings ───────────────────────────────────────────
    listen_addresses = '*'
    port = 5432
    max_connections = 200
    superuser_reserved_connections = 3

    # ── Memory (512 Mi container limit) ───────────────────────────────
    shared_buffers = 128MB
    effective_cache_size = 384MB
    work_mem = 4MB
    maintenance_work_mem = 64MB
    huge_pages = off

    # ── WAL ───────────────────────────────────────────────────────────
    wal_level = minimal
    wal_buffers = 16MB
    min_wal_size = 512MB
    max_wal_size = 2GB
    checkpoint_completion_target = 0.9
    # No replication standbys — disable WAL senders to reduce overhead.
    # Set wal_level = replica and max_wal_senders = 3 if you add a standby.
    max_wal_senders = 0

    # ── Query planner ─────────────────────────────────────────────────
    random_page_cost = 1.1
    effective_io_concurrency = 200
    default_statistics_target = 100

    # ── Statement / transaction timeouts ─────────────────────────────
    statement_timeout = 30s
    idle_in_transaction_session_timeout = 60s
    idle_session_timeout = 0
    lock_timeout = 10s

    # ── Logging ───────────────────────────────────────────────────────
    logging_collector = on
    log_destination = 'stderr'
    log_min_duration_statement = 500ms
    log_checkpoints = on
    log_connections = off
    log_disconnections = off
    log_lock_waits = on
    log_temp_files = 0
    log_autovacuum_min_duration = 0
    log_line_prefix = '%m [%p] %q%u@%d from=%h '

    # ── Autovacuum (aggressive — pp_system_snapshots is insert-heavy) ─
    autovacuum = on
    autovacuum_max_workers = 2
    autovacuum_naptime = 30s
    autovacuum_vacuum_scale_factor = 0.05
    autovacuum_analyze_scale_factor = 0.025
    autovacuum_vacuum_cost_limit = 1000

    # ── Locale ────────────────────────────────────────────────────────
    datestyle = 'iso, mdy'
    timezone = 'UTC'
    lc_messages = 'C'
    lc_monetary = 'C'
    lc_numeric = 'C'
    lc_time = 'C'
    default_text_search_config = 'pg_catalog.english'
