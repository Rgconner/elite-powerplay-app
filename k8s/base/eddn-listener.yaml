apiVersion: apps/v1
kind: Deployment
metadata:
  name: eddn-listener
  namespace: elite-powerplay
  labels:
    app: eddn-listener
    app.kubernetes.io/name: elite-powerplay
    app.kubernetes.io/component: eddn-listener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eddn-listener
  template:
    metadata:
      labels:
        app: eddn-listener
        app.kubernetes.io/name: elite-powerplay
        app.kubernetes.io/component: eddn-listener
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
      - name: eddn-listener
        image: ghcr.io/rgconner/elite-powerplay-eddn-listener:latest
        imagePullPolicy: Always
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: elite-powerplay-secrets
              key: database-url
        - name: EDDN_RELAY_URL
          value: "tcp://eddn.edcd.io:9500"
        - name: EDDN_SCHEMA_URL
          value: "https://eddn.edcd.io/schemas/journal/1"
        - name: TARGET_EVENT
          value: "PowerplayMerits"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        # Liveness: the main loop writes /tmp/eddn_heartbeat every iteration.
        # If the file is missing or older than 120 s the loop has stalled.
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "test $(( $(date +%s) - $(date +%s -r /tmp/eddn_heartbeat 2>/dev/null || echo 0) )) -lt 120"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        # Readiness: same file check but tighter window — pod is ready once
        # the first loop iteration has completed.
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "test -f /tmp/eddn_heartbeat"
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: eddn-listener
  namespace: elite-powerplay
  labels:
    app: eddn-listener
spec:
  selector:
    app: eddn-listener
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
  type: ClusterIP