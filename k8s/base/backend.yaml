# ─────────────────────────────────────────────────────────────────────────────
# backend.yaml  —  FastAPI / uvicorn Deployment + Service  (BASE)
#
# Image: ghcr.io/rgconner/elite-powerplay-backend:latest
# All sensitive values come from the Secret; non-secret config from ConfigMap.
#
# Database connectivity
# ─────────────────────
# The DATABASE_URL secret must point at whichever PostgreSQL instance is in
# use.  When deploying with the local-db overlay the URL is
#   postgresql://pp_user:<password>@postgres:5432/elite_powerplay
# When deploying with the external-db overlay set it to your external DSN.
#
# The wait-for-postgres init container is NOT included in this base spec.
# It is added by the local-db overlay as a strategic-merge patch because it
# is only meaningful when Postgres runs inside the same cluster.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: elite-powerplay
  labels:
    app.kubernetes.io/name: elite-powerplay
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  # Recreate is safer for a single-replica app that writes to Postgres on start
  # (avoids two pods running migrations simultaneously).
  # Switch to RollingUpdate once the app supports concurrent instances.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: elite-powerplay
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          # Pin to a specific sha tag in production; use :latest for dev.
          image: ghcr.io/rgconner/elite-powerplay-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            # ── From Secret ────────────────────────────────────────────────────
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: elite-powerplay-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: elite-powerplay-secrets
                  key: secret-key
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elite-powerplay-secrets
                  key: ai-api-key

            # ── From ConfigMap ─────────────────────────────────────────────────
            - name: LLM_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: elite-powerplay-config
                  key: LLM_ENABLED
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: elite-powerplay-config
                  key: AI_PROVIDER
            - name: SPANSH_INGEST_INTERVAL_HOURS
              valueFrom:
                configMapKeyRef:
                  name: elite-powerplay-config
                  key: SPANSH_INGEST_INTERVAL_HOURS
            - name: EDSM_SYNC_INTERVAL_HOURS
              valueFrom:
                configMapKeyRef:
                  name: elite-powerplay-config
                  key: EDSM_SYNC_INTERVAL_HOURS

            # ── DB pool tuning ─────────────────────────────────────────────────
            # All values are read by db/session.py; defaults are baked into the
            # code so this section is optional.  Listed here so the tuning is
            # explicit and discoverable in `kubectl describe deploy backend`.
            - name: DB_POOL_SIZE
              value: "10"
            - name: DB_MAX_OVERFLOW
              value: "20"
            - name: DB_POOL_TIMEOUT
              value: "10"
            - name: DB_POOL_RECYCLE
              value: "1800"
            - name: DB_POOL_PRE_PING
              value: "true"
            # Ingest uses a SEPARATE pool so a 5–10 min Spansh ingest cannot
            # starve the web request pool above.
            - name: DB_INGEST_POOL_SIZE
              value: "2"
            - name: DB_INGEST_MAX_OVERFLOW
              value: "0"
            - name: DB_INGEST_POOL_TIMEOUT
              value: "60"
            - name: DB_INGEST_POOL_RECYCLE
              value: "1800"
            - name: DB_INGEST_POOL_PRE_PING
              value: "true"

          resources:
            requests:
              cpu:    "100m"
              memory: "256Mi"
            limits:
              cpu:    "1000m"
              memory: "768Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

---

# ── ClusterIP Service ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: elite-powerplay
  labels:
    app.kubernetes.io/name: elite-powerplay
    app.kubernetes.io/component: backend
spec:
  selector:
    app: backend
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
